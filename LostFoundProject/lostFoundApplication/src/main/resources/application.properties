# ===============================
# SERVER CONFIG
# ===============================

server.port=${PORT:8080}

# ===============================
# DATABASE CONFIG (RAILWAY MYSQL)
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Library?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Jeevitha@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# SWAGGER
# ===============================

enable.swagger.plugin=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# ===============================
# JWT CONFIG
# ===============================

app.jwt.secret=${JWT_SECRET:myVeryLongSecretKeyThatIsAtLeast64CharactersLongForHS512AlgorithmAndMustBeSecure123456789}

app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}