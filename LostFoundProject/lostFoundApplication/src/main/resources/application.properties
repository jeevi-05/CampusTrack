# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── Database ─────────────────────────────────────────────────────────────────
# Local fallback values used when DB_URL / DB_USERNAME / DB_PASSWORD env vars are not set
spring.datasource.url=${DB_URL:jdbc:mysql://localhost/Library?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Jeevitha@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:myVeryLongSecretKeyThatIsAtLeast64CharactersLongForHS512AlgorithmAndMustBeSecure123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ─── WebSocket / Swagger ──────────────────────────────────────────────────────
enable.swagger.plugin=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# ─── Session Cookie (required for cross-domain Railway deployment) ────────────
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# ─── CORS allowed origin (set via Railway env var) ────────────────────────────
app.cors.allowed-origin=${FRONTEND_URL:https://campustrack-frontend.onrender.com}
